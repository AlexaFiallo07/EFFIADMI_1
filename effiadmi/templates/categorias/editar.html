{% extends 'base.html' %}

{% block titulo %}Editar Categoria{% endblock %}

{% block contenido %}
<div class="container">
    <div class="page-head">
        <h1>Editar Categoria</h1>
        <a href="{% url 'effiadmi:lista_categorias' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre de la categoria</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre }}" required>
                </div>
                <div class="card-footer">
                    <a href="{% url 'effiadmi:lista_categorias' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
