{% extends 'base.html' %}

{% block titulo %}Editar Pedido{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 760px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Editar Pedido PED-{{ pedido.id }}</h1>
        <a href="{% url 'effiadmi:lista_pedidos' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="card-body">
                <div class="form-group">
                    <label for="cliente" class="form-label">Cliente</label>
                    <select id="cliente" name="cliente" class="form-control" required>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.id }}" {% if cliente.id == pedido.cliente.id %}selected{% endif %}>
                                {{ cliente.nombre }} - {{ cliente.correo }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="total" class="form-label">Total</label>
                    <input type="number" id="total" name="total" class="form-control" value="{{ pedido.total }}" min="0" step="0.01" required>
                </div>
            </div>
            <div class="card-footer">
                <button type="submit" class="btn btn-primary">Actualizar</button>
                <a href="{% url 'effiadmi:lista_pedidos' %}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
