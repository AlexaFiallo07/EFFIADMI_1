{% extends 'base.html' %}

{% block titulo %}Editar Factura{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 760px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Factura #{{ factura.id }}</h1>
        <a href="{% url 'effiadmi:lista_facturas' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body" style="text-align: center; padding: 40px;">
            <span class="material-symbols-outlined" style="font-size: 48px; color: #eab308;">warning</span>
            <h3 style="margin-top: 16px; color: #1e293b;">Las facturas emitidas no se pueden editar</h3>
            <p style="color: #64748b; margin-top: 8px;">Si hay un error, anule esta factura y genere una nueva.</p>
            <a href="{% url 'effiadmi:detalle_factura' factura.id %}" class="btn btn-primary" style="margin-top: 16px;">Ver Factura</a>
        </div>
    </div>
</div>
{% endblock %}
