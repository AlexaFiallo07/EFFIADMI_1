{% extends 'base.html' %}

{% block titulo %}Editar Factura{% endblock %}

{% block contenido %}
<div class="container container-narrow">
    <div class="page-head">
        <h1>Factura #{{ factura.id }}</h1>
        <a href="{% url 'effiadmi:facturacion' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="stack">
                <span class="material-symbols-outlined">warning</span>
                <h3 class="card-title">Las facturas emitidas no se pueden editar</h3>
                <p class="text-muted">Si hay un error, anule esta factura y genere una nueva.</p>
                <div>
                    <a href="{% url 'effiadmi:detalle_factura' factura.id %}" class="btn btn-primary">Ver Factura</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
