{% extends 'base.html' %}

{% block titulo %}Crear Factura{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 900px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Crear Factura</h1>
        <a href="{% url 'effiadmi:lista_facturas' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <form method="post" id="formFactura">
            {% csrf_token %}
            <div class="card-body">
                <div class="form-group">
                    <label for="cliente" class="form-label">Cliente</label>
                    <select id="cliente" name="cliente" class="form-control" required>
                        <option value="">Selecciona un cliente</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nombre }} - {{ cliente.correo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" style="margin-top: var(--spacing-lg);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <label class="form-label" style="margin: 0;">Productos</label>
                        <button type="button" class="btn btn-outline btn-sm" onclick="agregarProducto()">+ Agregar producto</button>
                    </div>

                    <table class="table" id="tablaProductos">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th style="width: 100px;">Cantidad</th>
                                <th style="width: 120px;">Precio</th>
                                <th style="width: 120px;">Subtotal</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoProductos">
                        </tbody>
                    </table>
                    <p id="mensajeVacio" style="color: #64748b; font-size: 13px; text-align: center; padding: 20px 0;">Haz clic en "+ Agregar producto" para comenzar.</p>
                </div>

                <div style="display: flex; justify-content: flex-end; margin-top: var(--spacing-lg); border-top: 1px solid #e2e8f0; padding-top: var(--spacing-lg);">
                    <div style="text-align: right;">
                        <span style="font-size: 14px; color: #64748b;">Total:</span>
                        <h2 id="totalFactura" style="margin: 0; font-size: 24px; font-weight: 600; color: #0f172a;">$0</h2>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button type="submit" class="btn btn-primary">Crear Factura</button>
                <a href="{% url 'effiadmi:lista_facturas' %}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    const productos = [
        {% for p in productos %}
        {id: {{ p.id }}, nombre: "{{ p.nombre|escapejs }}", precio: {{ p.precio_venta }} }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    let contador = 0;

    function agregarProducto() {
        contador++;
        const tbody = document.getElementById("cuerpoProductos");
        const fila = document.createElement("tr");
        fila.id = "fila-" + contador;

        let opciones = '<option value="">Selecciona...</option>';
        for (const p of productos) {
            opciones += '<option value="' + p.id + '" data-precio="' + p.precio + '">' + p.nombre + ' - $' + p.precio + '</option>';
        }

        fila.innerHTML = 
            '<td><select name="producto" class="form-control" required onchange="actualizarPrecio(this)">' + opciones + '</select></td>' +
            '<td><input type="number" name="cantidad" class="form-control" min="1" value="1" required onchange="calcularSubtotal(this)" oninput="calcularSubtotal(this)"></td>' +
            '<td><span class="precio-unitario">$0</span><input type="hidden" name="precio_unitario"></td>' +
            '<td><span class="subtotal-fila">$0</span></td>' +
            '<td><button type="button" class="btn btn-ghost btn-sm" onclick="eliminarProducto(' + contador + ')" title="Eliminar">&times;</button></td>';

        tbody.appendChild(fila);
        document.getElementById("mensajeVacio").style.display = "none";
    }

    function eliminarProducto(id) {
        const fila = document.getElementById("fila-" + id);
        if (fila) fila.remove();
        calcularTotal();
        if (document.getElementById("cuerpoProductos").children.length === 0) {
            document.getElementById("mensajeVacio").style.display = "block";
        }
    }

    function actualizarPrecio(select) {
        const fila = select.closest("tr");
        const option = select.options[select.selectedIndex];
        const precio = option.getAttribute("data-precio") || 0;
        fila.querySelector(".precio-unitario").textContent = "$" + parseFloat(precio).toFixed(0);
        fila.querySelector('input[name="precio_unitario"]').value = precio;
        calcularSubtotal(select);
    }

    function calcularSubtotal(el) {
        const fila = el.closest("tr");
        const precio = parseFloat(fila.querySelector('input[name="precio_unitario"]').value) || 0;
        const cantidad = parseInt(fila.querySelector('input[name="cantidad"]').value) || 0;
        const subtotal = precio * cantidad;
        fila.querySelector(".subtotal-fila").textContent = "$" + subtotal.toFixed(0);
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll(".subtotal-fila").forEach(function(el) {
            total += parseFloat(el.textContent.replace("$", "")) || 0;
        });
        document.getElementById("totalFactura").textContent = "$" + total.toFixed(0);
    }
</script>
{% endblock %}
