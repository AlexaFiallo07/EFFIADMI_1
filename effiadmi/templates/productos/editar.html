{% extends 'base.html' %}

{% block titulo %}Editar Producto{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Editar Producto</h1>
        <a href="{% url 'effiadmi:lista_productos' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            <div class="card-body">
                <div class="form-group">
                    <label for="sku" class="form-label">ID</label>
                    <input type="text" id="sku" name="sku" class="form-control" value="{{ producto.sku }}" required>
                </div>
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                </div>
                <div class="form-group">
                    <label for="descripcion" class="form-label">Descripcion</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ producto.descripcion }}</textarea>
                </div>
                <div class="form-group">
                    <label for="categoria" class="form-label">Categoria</label>
                    <input type="text" id="categoria" name="categoria" class="form-control" value="{{ producto.categoria }}">
                </div>
                <div class="form-group">
                    <label for="precio_venta" class="form-label">Precio Venta</label>
                    <input type="number" id="precio_venta" name="precio_venta" class="form-control" step="0.01" min="0.01" value="{{ producto.precio_venta }}" required>
                </div>
            </div>
            <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    {% if producto.activo %}
                        <a href="{% url 'effiadmi:eliminar_producto' producto.id %}" class="btn btn-outline" style="color: #ef4444; border-color: #ef4444;" onclick="event.preventDefault(); document.getElementById('formDesactivar').submit();">Desactivar</a>
                        <form id="formDesactivar" method="POST" action="{% url 'effiadmi:eliminar_producto' producto.id %}" style="display: none;">{% csrf_token %}</form>
                    {% else %}
                        <a href="{% url 'effiadmi:eliminar_producto' producto.id %}" class="btn btn-outline" style="color: #10b981; border-color: #10b981;" onclick="event.preventDefault(); document.getElementById('formActivar').submit();">Activar</a>
                        <form id="formActivar" method="POST" action="{% url 'effiadmi:eliminar_producto' producto.id %}" style="display: none;">{% csrf_token %}</form>
                    {% endif %}
                </div>
                <div style="display: flex; gap: var(--spacing-md);">
                    <a href="{% url 'effiadmi:lista_productos' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
