{% extends 'base.html' %}

{% block titulo %}Nuevo Producto{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Nuevo Producto</h1>
        <a href="{% url 'effiadmi:lista_productos' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="sku" class="form-label">ID</label>
                    <input type="text" id="sku" name="sku" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="descripcion" class="form-label">Descripcion</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="categoria" class="form-label">Categoria</label>
                    <input type="text" id="categoria" name="categoria" class="form-control">
                </div>

                <div class="form-group">
                    <label for="precio_venta" class="form-label">Precio Venta</label>
                    <input type="number" id="precio_venta" name="precio_venta" class="form-control" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="sucursal" class="form-label">Sucursal</label>
                    <select id="sucursal" name="sucursal" class="form-control">
                        <option value="">-- Seleccionar sucursal --</option>
                        {% for sucursal in sucursales %}
                            <option value="{{ sucursal.id }}" {% if sucursal.es_principal %}selected{% endif %}>
                                {{ sucursal.nombre }} {% if sucursal.es_principal %}(Principal){% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="stock_inicial" class="form-label">Stock Inicial</label>
                    <input type="number" id="stock_inicial" name="stock_inicial" class="form-control" value="0">
                </div>

                <div class="form-group">
                    <label for="stock_minimo" class="form-label">Stock Minimo</label>
                    <input type="number" id="stock_minimo" name="stock_minimo" class="form-control" value="5">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <a href="{% url 'effiadmi:lista_productos' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
