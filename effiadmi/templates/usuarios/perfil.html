{% extends 'base.html' %}

{% block titulo %}Mi Perfil{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 820px; margin: 0 auto;">
    <h1 style="margin-bottom: var(--spacing-lg);">Mi Perfil</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="card-header">
                <h3 class="card-title">Informacion de Usuario</h3>
            </div>

            <div class="card-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg);">
                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.first_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-control" value="{{ usuario.last_name }}" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg);">
                    <div class="form-group">
                        <label for="email" class="form-label">Correo</label>
                        <input type="email" id="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono" class="form-label">Telefono</label>
                        <input type="text" id="telefono" name="telefono" class="form-control" value="{{ perfil.telefono }}">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); margin-bottom: var(--spacing-lg);">
                    <div class="form-group">
                        <label for="direccion" class="form-label">Direccion</label>
                        <input type="text" id="direccion" name="direccion" class="form-control" value="{{ perfil.direccion }}">
                    </div>

                    <div class="form-group">
                        <label for="cargo" class="form-label">Cargo</label>
                        <input type="text" id="cargo" class="form-control" value="{{ perfil.cargo }}" readonly>
                    </div>
                </div>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{% url 'effiadmi:logout' %}" class="btn btn-outline">Cerrar Sesion</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
