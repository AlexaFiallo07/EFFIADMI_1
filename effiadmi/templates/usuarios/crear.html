{% extends 'base.html' %}

{% block titulo %}Nuevo Usuario{% endblock %}

{% block contenido %}
<div class="container-narrow">
    <div class="page-head">
        <h1>Nuevo Usuario</h1>
        <a href="{% url 'effiadmi:perfil' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" autocomplete="off" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <label for="nombre_usuario" class="form-label">Nombre Usuario</label>
                    <input
                        type="text"
                        id="nombre_usuario"
                        name="nombre_usuario"
                        class="form-control"
                        value="{{ request.POST.nombre_usuario|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="apellido_usuario" class="form-label">Apellido Usuario</label>
                    <input
                        type="text"
                        id="apellido_usuario"
                        name="apellido_usuario"
                        class="form-control"
                        value="{{ request.POST.apellido_usuario|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        value="{{ request.POST.email|default:'' }}"
                        pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}"
                        title="Ejemplo: usuario@dominio.com"
                        inputmode="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cargo" class="form-label">Cargo</label>
                    <select id="cargo" name="cargo" class="form-control" required>
                        <option value="" {% if not request.POST.cargo %}selected{% endif %}>Selecciona un cargo</option>
                        <option value="admin" {% if request.POST.cargo == 'admin' %}selected{% endif %}>Administrador</option>
                        <option value="operador" {% if request.POST.cargo == 'operador' %}selected{% endif %}>Operador</option>
                    </select>
                </div>

                <div class="card-footer">
                    <a href="{% url 'effiadmi:perfil' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
