{% extends 'base.html' %}

{% block titulo %}Editar Usuario{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Editar Usuario</h1>
        <a href="{% url 'effiadmi:lista_usuarios' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" autocomplete="off">
                {% csrf_token %}

                <div class="form-group">
                    <label for="nombre_usuario" class="form-label">Nombre</label>
                    <input
                        type="text"
                        id="nombre_usuario"
                        name="nombre_usuario"
                        class="form-control"
                        value="{{ usuario.first_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="apellido_usuario" class="form-label">Apellido</label>
                    <input
                        type="text"
                        id="apellido_usuario"
                        name="apellido_usuario"
                        class="form-control"
                        value="{{ usuario.last_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        value="{{ usuario.email }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contraseña" class="form-label">Contraseña (dejar en blanco para no cambiar)</label>
                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label for="cargo" class="form-label">Cargo</label>
                    <select id="cargo" name="cargo" class="form-control" required>
                        <option value="admin" {% if perfil.cargo == 'admin' %}selected{% endif %}>Administrador</option>
                        <option value="operador" {% if perfil.cargo == 'operador' %}selected{% endif %}>Operador</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <a href="{% url 'effiadmi:lista_usuarios' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
