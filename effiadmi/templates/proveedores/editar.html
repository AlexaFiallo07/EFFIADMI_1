{% extends 'base.html' %}

{% block titulo %}Editar Proveedor{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>Editar Proveedor</h1>
        <a href="{% url 'effiadmi:lista_proveedores' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="nombre_proveedor" class="form-label">Nombre Proveedor</label>
                    <input
                        type="text"
                        id="nombre_proveedor"
                        name="nombre_proveedor"
                        class="form-control"
                        value="{{ proveedor.nombre_proveedor }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="correo" class="form-label">Correo</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        class="form-control"
                        value="{{ proveedor.correo }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        class="form-control"
                        value="{{ proveedor.telefono }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="direccion" class="form-label">Direccion</label>
                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        class="form-control"
                        value="{{ proveedor.direccion }}"
                        required
                    >
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <a href="{% url 'effiadmi:lista_proveedores' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
