{% extends 'base.html' %}

{% block titulo %}Detalle Proveedor{% endblock %}

{% block contenido %}
<div class="container">
    <div class="page-head">
        <h1>{{ proveedor.nombre }}</h1>
        <a href="{% url 'effiadmi:lista_proveedores' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">Nombre Proveedor</label>
                <p>{{ proveedor.nombre }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Correo</label>
                <p>{{ proveedor.correo }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Telefono</label>
                <p>{{ proveedor.telefono }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Direccion</label>
                <p>{{ proveedor.direccion }}</p>
            </div>
        </div>
        <div class="card-footer">
            <a href="{% url 'effiadmi:editar_proveedor' proveedor.id %}" class="btn btn-primary">Editar</a>
        </div>
    </div>
</div>
{% endblock %}
