{% extends 'base.html' %}

{% block titulo %}Detalle Cliente{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 760px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>{{ cliente.nombre }}</h1>
        <a href="{% url 'effiadmi:lista_clientes' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <p>{{ cliente.nombre }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Correo</label>
                <p>{{ cliente.correo }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Telefono</label>
                <p>{{ cliente.telefono }}</p>
            </div>

            <div class="form-group">
                <label class="form-label">Direccion</label>
                <p>{{ cliente.direccion }}</p>
            </div>
        </div>
        <div class="card-footer">
            <a href="{% url 'effiadmi:editar_cliente' cliente.id %}" class="btn btn-primary">Editar</a>
        </div>
    </div>
</div>
{% endblock %}
