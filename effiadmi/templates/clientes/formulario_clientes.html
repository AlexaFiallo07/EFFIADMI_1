{% extends 'base.html' %}

{% block titulo %}{% if datos %}Editar Cliente{% else %}Nuevo Cliente{% endif %}{% endblock %}

{% block contenido %}
<div class="container" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
        <h1>{% if datos %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h1>
        <a href="{% url 'effiadmi:lista_clientes' %}" class="btn btn-outline">Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        value="{{ datos.nombre|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="correo" class="form-label">Correo</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        class="form-control"
                        value="{{ datos.correo|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        class="form-control"
                        value="{{ datos.telefono|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="direccion" class="form-label">Direccion</label>
                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        class="form-control"
                        value="{{ datos.direccion|default:'' }}"
                        required
                    >
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <a href="{% url 'effiadmi:lista_clientes' %}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
