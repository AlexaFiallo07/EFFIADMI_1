name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # La suite corre con DEBUG=0 para acercarse a produccion. Con ese modo
      # base/settings.py exige SECRET_KEY (>=50) y ALLOWED_HOSTS.
      DEBUG: "0"
      SECRET_KEY: "ci-secret-key-solo-para-tests-0123456789-0123456789-abcdef"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar la configuracion de Django
        run: python manage.py check

      - name: Ejecutar la suite de pruebas
        run: python manage.py test --verbosity 2
